services:
  home-assistant-dashboard:
    image: ghcr.io/jandev/home-assistant-dashboard:latest
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL:-${HOMEASSISTANT_ADDRESS:-}}
      HOMEASSISTANT_API_KEY: ${HOMEASSISTANT_API_KEY:?Stel HOMEASSISTANT_API_KEY in}
      AFVALKALENDER_ADRESS: ${AFVALKALENDER_ADRESS:?Stel AFVALKALENDER_ADRESS in}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      TZ: Europe/Amsterdam
    ports:
      - "${DASHBOARD_PORT:-8090}:8080"
    volumes:
      - dashboard-data:/app/data
      - ${LOCAL_WORKSPACE_FOLDER:-.}/config/dashboard.json:/app/config/dashboard.json:ro
      - ${LOCAL_WORKSPACE_FOLDER:-.}/photos:/app/photos:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dashboard-data:
