name: Check and publish container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check current main and existing commit image
        id: source
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_main" != "$COMMIT_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nieuwere main-commit aanwezig; deze verouderde run publiceert niet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          image="ghcr.io/jandev/home-assistant-dashboard:sha-$COMMIT_SHA"
          if docker buildx imagetools inspect "$image" > /tmp/existing-image.txt 2>/tmp/existing-image-error.txt; then
            digest=$(awk '/^Digest:/ { print $2; exit }' /tmp/existing-image.txt)
            test -n "$digest"
            echo "existing=$digest" >> "$GITHUB_OUTPUT"
          elif ! grep -Eiq 'not found|manifest unknown' /tmp/existing-image-error.txt; then
            cat /tmp/existing-image-error.txt >&2
            exit 1
          fi
      - name: Build timestamp
        id: timestamp
        if: steps.source.outputs.publish == 'true' && steps.source.outputs.existing == ''
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build both platforms and publish
        id: build
        if: steps.source.outputs.publish == 'true' && steps.source.outputs.existing == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jandev/home-assistant-dashboard:latest
            ghcr.io/jandev/home-assistant-dashboard:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jandev/home-assistant-dashboard
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reuse immutable commit image on rerun
        if: steps.source.outputs.publish == 'true' && steps.source.outputs.existing != ''
        env:
          EXISTING_DIGEST: ${{ steps.source.outputs.existing }}
        run: docker buildx imagetools create --tag ghcr.io/jandev/home-assistant-dashboard:latest "ghcr.io/jandev/home-assistant-dashboard@$EXISTING_DIGEST"
      - name: Publication summary
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.source.outputs.existing }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Container gepubliceerd"
            echo "Commit: $COMMIT_SHA"
            echo "Image: ghcr.io/jandev/home-assistant-dashboard:latest"
            echo "Commit-tag: ghcr.io/jandev/home-assistant-dashboard:sha-$COMMIT_SHA"
            echo "Digest: ghcr.io/jandev/home-assistant-dashboard@$IMAGE_DIGEST"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
