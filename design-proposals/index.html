<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thuis — ontwerpvoorstellen</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9e6e0;color:#2f3936;font:16px system-ui,sans-serif;--bg:#f6f4ef;--card:#fffefa;--line:#e7e6dd;--muted:#78817c;--accent:#537c69;--soft:#e7efe6;--yellow:#f7edc6}button,input{font:inherit}button{cursor:pointer;color:inherit;min-height:48px;border:0}button:focus-visible,input:focus-visible{outline:3px solid #408cca;outline-offset:3px}.studio{padding:16px 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ccc9c1;background:#fffefa}.studio strong{margin-right:auto}.studio button{padding:8px 18px;border-radius:24px;background:#eeeae2}.studio button[aria-pressed=true]{background:#304f42;color:white}.shell{max-width:1920px;margin:auto;background:var(--bg);padding:30px 40px 18px;min-height:calc(100vh - 81px);display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:4px 0}h2{font-size:21px;margin:0 0 20px}h3{font-size:16px;margin:0 0 8px}p{color:var(--muted);line-height:1.5}.tag{background:var(--soft);color:var(--accent);border-radius:20px;padding:10px 16px;font-size:13px}.grid{display:grid;gap:24px;flex:1}.today{grid-template-columns:0.8fr 1.45fr 1fr}.card{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:26px}.time{font-size:clamp(50px,6vw,92px);letter-spacing:-6px;line-height:1.1;margin:10px 0}.weather{font-size:56px;margin-top:30px}.temp{font-size:36px}.forecast{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;margin-top:24px;font-size:14px;color:var(--muted)}.event{display:flex;gap:18px;background:var(--bg);border-left:4px solid #afaba1;padding:18px;border-radius:14px;margin:12px 0}.event time{font-weight:650;min-width:44px}.event p{font-size:13px;margin:5px 0 0}.blue{border-color:#5b95ca;background:#eaf1f9}.pink{border-color:#ce81a9;background:#faedf4}.orange{border-color:#cd955f;background:#faf0e3}.day{font-size:12px;font-weight:700;color:var(--muted);margin:24px 0 12px;text-transform:uppercase;letter-spacing:1px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{text-align:left;padding:18px;background:var(--bg);border:1px solid var(--line);border-radius:18px;min-height:94px}.action.on{background:var(--yellow)}.action small{display:block;color:var(--muted);margin-top:8px}.mini{margin-top:20px;background:var(--soft);padding:18px;border-radius:18px;display:flex;gap:14px;align-items:center}.mini button{margin-left:auto;background:transparent;font-size:24px}.art{background:linear-gradient(135deg,#be9e76,#5c7775);width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff}.status{display:flex;justify-content:space-around;gap:16px;margin-top:24px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;font-size:14px}.status b{margin-right:8px}nav{display:flex;justify-content:center;gap:8px;margin:24px auto 0;padding:7px;background:var(--card);border:1px solid var(--line);border-radius:24px}nav button{padding:12px 26px;background:transparent;border-radius:17px;color:var(--muted)}nav button.active{background:var(--accent);color:white}.rooms{grid-template-columns:repeat(3,1fr)}.room{min-height:170px;text-align:left}.room .glyph{font-size:28px;margin-bottom:18px;display:block}.room p{margin-bottom:0}.wide{grid-column:1/-1}.scene-row{display:flex;gap:12px;align-items:center}.pill{padding:10px 20px;border-radius:16px;background:var(--soft)}.energy{grid-template-columns:2fr 1fr}.house{min-height:380px;position:relative;display:grid;place-items:center;overflow:hidden}.house img{width:85%;max-height:440px;object-fit:contain;border-radius:22px}.flow{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;box-shadow:0 6px 25px #0000000a}.solar{top:20px;left:24px;color:var(--accent)}.homepower{bottom:22px;left:25%}.net{top:45%;right:16px}.number{font-size:30px;font-weight:600;display:block}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metrics div{padding:18px;background:var(--bg);border-radius:16px}.metrics small{display:block;color:var(--muted);margin-bottom:8px}.consumers{margin-top:24px}.consumers p{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.music{grid-template-columns:1.8fr 1fr}.player{text-align:center}.album{width:230px;height:230px;max-width:50vw;border-radius:22px;margin:24px auto;background:linear-gradient(145deg,#bea37e,#48685c 65%,#263f3a);display:flex;align-items:center;justify-content:center;color:#e7e3cf;font-size:85px;box-shadow:0 20px 40px #0002}.controls{display:flex;justify-content:center;gap:22px;align-items:center}.controls button{border-radius:50%;background:var(--soft);width:54px;font-size:24px}.controls .play{width:72px;height:72px;background:var(--accent);color:white}.progress{height:4px;background:var(--line);margin:26px auto 12px;width:80%;border-radius:4px}.progress i{display:block;width:38%;height:100%;background:var(--accent)}input[type=range]{width:65%;min-height:48px;accent-color:var(--accent)}.playlist{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:transparent;border-bottom:1px solid var(--line);padding:16px 0}.camera{grid-template-columns:3fr 1fr}.camera-placeholder{min-height:370px;background:linear-gradient(155deg,#8d9a96,#4d625a);border-radius:20px;display:flex;justify-content:center;align-items:center;flex-direction:column;color:#fff}.camera-placeholder p{color:#e1e7e3}.note{font-size:12px;color:var(--muted);margin:14px 0 0}.night{color:#e7e9e4;background:#151e1c;--bg:#182320;--card:#22302b;--line:#34423c;--muted:#a5b3aa;--accent:#9bc7a7;--soft:#30463a;--yellow:#665936}.night nav button.active,.night .controls .play{color:#15251c}.night .event{background:#2c3933}.night .blue{background:#26394b}.night .pink{background:#43313d}.night .orange{background:#463a2b}.compact{--bg:#f2f4f7;--card:white;--accent:#456687;--soft:#e6edf5;--line:#dfe5eb;--muted:#748191;--yellow:#fff0bf;color:#26384b}.compact .card{border-radius:12px;padding:22px}.compact .shell{padding:24px}.compact .today{grid-template-columns:.8fr 1.6fr 1fr}.compact .event{padding:14px;border-radius:8px}.compact .action{border-radius:10px}.compact nav{border-radius:12px}.compact nav button{border-radius:8px}dialog{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:24px;width:min(520px,92vw);padding:30px}dialog::backdrop{background:#10251c77}dialog button{background:var(--soft);border-radius:12px;padding:10px 20px}#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#304f42;color:white;padding:14px 24px;border-radius:16px;display:none;z-index:5}@media(max-width:1100px){.shell{padding:20px}.grid{gap:14px}.card{padding:18px}.today{grid-template-columns:.8fr 1.3fr 1fr}.action{padding:12px;min-height:80px}.event{padding:12px}.time{letter-spacing:-3px}nav button{padding:10px 18px}.studio{flex-wrap:wrap}.rooms{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.today,.energy,.music,.camera{grid-template-columns:1fr}.rooms{grid-template-columns:1fr 1fr}.status{flex-wrap:wrap}nav{position:sticky;bottom:8px;gap:0;width:100%}nav button{flex:1;padding:8px 3px;font-size:12px}.studio{padding:12px}.studio strong{width:100%}.studio button{padding:8px 12px}.house{min-height:320px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}
</style><body><div class="studio"><strong>THUIS <span style="font-weight:400;color:#78817c"> / designstudie</span></strong><button data-theme="" aria-pressed="true">01 · Warm wonen</button><button data-theme="night" aria-pressed="false">02 · Avondrust</button><button data-theme="compact" aria-pressed="false">03 · Helder overzicht</button></div><main class="shell"><header><div><div class="eyebrow">Home</div><h1 id="title"></h1></div><span class="tag">Ontwerp · voorbeelddata</span></header><section id="content"></section><nav aria-label="Dashboardpagina’s"></nav><p class="note" style="text-align:center" id="description"></p></main><dialog><h2 id="dialog-title"></h2><div id="dialog-body"></div><button onclick="this.closest('dialog').close()">Sluiten</button></dialog><div id="toast" role="status"></div><script>
const names=['Energie','Huis','Vandaag','Muziek',"Camera’s"],icons=['↯','⌂','◷','♫','▣'];let page=2,speaker='Speaker 1',playing=true;const $=s=>document.querySelector(s);const descriptions=['Warm wonen · zachte saliegroene accenten, royale kaarten en een rustige gezinssfeer.','Avondrust · dezelfde indeling met gedempte kleuren voor de woonkamer in de avond.','Helder overzicht · strakkere kaarten en compactere informatie voor kleinere tablets.'];
function action(name,on=false,scene=false){return `<button class="action ${on?'on':''}" data-action="${scene?'scene':'lamp'}"><b>${scene?'✧':'☼'} ${name}</b><small>${scene?'Scène uitvoeren':on?'Aan · tik om uit te zetten':'Uit · tik om aan te zetten'}</small></button>`}
function event(time,name,detail,color=''){return `<button class="event ${color}" style="width:100%;text-align:left;color:inherit" data-detail="${name}"><time>${time}</time><div><b>${name}</b><p>${detail}</p></div></button>`}
function render(){ $('#title').textContent=['Je energie in beeld','Een fijn huis','Goedemiddag, thuis','Tijd voor muziek','Een blik naar buiten'][page]; $('nav').innerHTML=names.map((n,i)=>`<button class="${i===page?'active':''}" ${i===page?'aria-current="page"':''} data-page="${i}">${icons[i]} ${n}${i===2?' ⌂':''}</button>`).join('');let html='';
if(page===2)html=`<div class="grid today"><article class="card"><div class="eyebrow">Vandaag</div><div class="time">16:42</div><p>Een rustig moment thuis.</p><div class="weather">☁ <span class="temp">12°</span></div><h3>Weer · bewolkt</h3><p>Kans op regen vanavond</p><div class="forecast"><span>17u<br>☁ 12°</span><span>18u<br>☂ 11°</span><span>19u<br>☁ 10°</span></div><p class="note">Weer en verwachting zijn voorbeelddata.</p></article><article class="card"><h2>De gezinsagenda <span style="float:right;color:var(--muted)">↗</span></h2><div class="day">Vandaag</div>${event('17:00','Voorbeeldafspraak','Tot 18:00','blue')}${event('19:30','Filmavond','Samen op de bank')}<div class="day">Morgen</div>${event('10:00','Voorbeeldafspraak','Tot 12:30','orange')}${event('14:00','Voorbeeldafspraak','Tot 15:00','pink')}</article><article class="card"><h2>Even regelen</h2><div class="actions">${action('Licht 1',true)}${action('Licht 2',true)}${action('Scene 1',false,true)}${action('Scene 2',false,true)}</div><p class="note">Licht 1: voorgestelde groepsbediening.</p><div class="mini"><div class="art">♫</div><div><b>Voorbeeldnummer</b><br><small>Speaker · voorbeeldartiest</small></div><button data-play aria-label="Afspelen of pauzeren">${playing?'Ⅱ':'▶'}</button></div><button class="pill" data-page="3" style="margin-top:14px;width:100%">Open muziek →</button></article></div><div class="status"><span>♨ Binnen <b>21,5 °C</b></span><span>↯ Verbruik <b>486 W</b></span><button data-waste style="background:transparent;min-height:48px;margin:-12px 0">♧ Rest <b>di 3 november →</b></button></div>`;
if(page===1)html=`<div class="grid rooms"><div class="card wide scene-row"><b>Scènes</b><button class="pill" data-action="scene">Scene 1</button><button class="pill" data-action="scene">Scene 2</button><button class="pill" data-action="scene">Woonkamer licht</button></div>${[['Woonkamer','21,5 °C','4 lampen aan','☼'],['Keuken','Temperatuur niet beschikbaar','2 lampen aan','◉'],['Apparaat 1','20,1 °C','1 lamp aan','▤'],['Badkamer','22,0 °C','Lampen uit','◈'],['Slaapkamers','Indeling nog te bevestigen','Open apparaten','☾'],['Buiten','12 °C · voorbeeld','Terraslamp uit','♧']].map(r=>`<button class="card room" data-room="${r[0]}"><span class="glyph">${r[3]}</span><h2>${r[0]}</h2><p>${r[1]}<br>${r[2]} →</p></button>`).join('')}</div>`;
if(page===0)html=`<div class="grid energy"><article class="card"><h2>Zo stroomt je energie <span class="tag" style="float:right">Nu · voorbeeld</span></h2><div class="house"><img src="../src/assets/house-energy.png" alt="Isometrische illustratie van het huis met zonnepanelen"><div class="flow solar">Zonnepanelen ↓<b class="number">1,24 kW</b></div><div class="flow homepower">↓ Huisverbruik<b class="number">486 W</b></div><div class="flow net">→ Terug naar het net<b class="number">754 W</b></div></div><button class="pill" data-history>Bekijk historie · dag / week / maand →</button></article><article class="card"><h2>Vandaag</h2><div class="metrics"><div><small>Opgewekt</small><b>8,6 kWh</b></div><div><small>Verbruikt</small><b>6,2 kWh</b></div><div><small>Netafname</small><b>2,4 kWh</b></div><div><small>Teruggeleverd</small><b>4,8 kWh</b></div></div><div class="consumers"><h3>Gemeten apparaten</h3><p>Apparaat 1 <b>124 W</b></p><p>Apparaat 2 <b>68 W</b></p><p>Apparaat 3 <b>42 W</b></p><p>Gas <b>0,8 m³</b></p></div><p class="note">Illustratieve waarden. Opwek voor en achter is samengevoegd.</p></article></div>`;
if(page===3)html=`<div class="grid music"><article class="card player"><div class="scene-row" style="justify-content:center"><b>Speelt op</b>${['Speaker 1','Speaker 2'].map(s=>`<button class="pill" data-speaker="${s}" style="${speaker===s?'background:var(--accent);color:var(--bg)':''}">${s}</button>`).join('')}</div><div class="album">♫</div><h2>Voorbeeldnummer</h2><p>Voorbeeldartiest · lokale bibliotheek</p><div class="progress"><i></i></div><small>1:24 / 3:42</small><div class="controls" style="margin:20px"><button data-demo aria-label="Vorig nummer">‹</button><button class="play" data-play aria-label="Afspelen of pauzeren">${playing?'Ⅱ':'▶'}</button><button data-demo aria-label="Volgend nummer">›</button></div><label>Volume · ${speaker}<br><input type="range" aria-label="Volume" value="35"></label></article><article class="card"><h2>Waar heb je zin in?</h2><button class="pill" style="width:100%;text-align:left" data-search>⌕ Zoek muziek, artiesten, albums…</button><div class="day">Favoriete afspeellijsten</div>${['Rustig thuis','Aan tafel','Weekend'].map((n,i)=>`<button class="playlist" data-playlist="${n}"><span class="art" style="filter:hue-rotate(${i*55}deg)">♫</span><span><b>${n}</b><br><small>Voorbeeldfavoriet</small></span></button>`).join('')}<button class="pill" style="margin-top:24px" data-queue>Bekijk wachtrij →</button><p class="note">Favorieten, zoeken en wachtrij: technische mogelijkheden nog te verifiëren.</p></article></div>`;
if(page===4)html=`<div class="grid camera"><article class="card"><h2>Voordeur</h2><button class="camera-placeholder" style="width:100%" data-camera><span style="font-size:54px">▣</span><h2>Ruimte voor het camerabeeld</h2><p>Ontwerpvoorbeeld · geen liveverbinding</p><span>Vergroot beeld ↗</span></button></article><article class="card"><h2>Rondom het huis</h2><p>De voordeur krijgt alle ruimte. Extra beelden verschijnen hier zodra camera’s zijn gekoppeld.</p><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><h3>Beeld niet beschikbaar?</h3><p>In de uiteindelijke app verschijnen een duidelijke melding en een herlaadknop.</p><button class="pill" data-demo>Opnieuw laden</button></article></div>`;
$('#content').innerHTML=html;$('#description').textContent=descriptions[document.body.classList.contains('night')?1:document.body.classList.contains('compact')?2:0];}
function modal(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('dialog').showModal()}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',2400)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme!==undefined){document.body.className=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}if(b.dataset.page!==undefined){page=+b.dataset.page;render()}if(b.dataset.action==='lamp'){b.classList.toggle('on');b.querySelector('small').textContent=b.classList.contains('on')?'Aan · tik om uit te zetten':'Uit · tik om aan te zetten'}if(b.dataset.action==='scene')toast('Demo · scèneopdracht verstuurd');if(b.hasAttribute('data-play')){playing=!playing;render()}if(b.dataset.speaker){speaker=b.dataset.speaker;render();toast('Demo · bediening voor '+speaker)}if(b.dataset.detail)modal(b.dataset.detail,'<p>Voorbeeldafspraak uit Gezin. Hier staan tijd, eindtijd en locatie. De agenda is alleen-lezen.</p>');if(b.dataset.room)modal(b.dataset.room,`<p>Voorbeeld van het kamerpaneel.</p>${action('Lamp',true)}<p><label>Dimmen <input type="range" aria-label="Dimmen" value="65"></label></p><p>Bij implementatie volgen apparaten en kamers de Home Assistant-indeling.</p>`);if(b.hasAttribute('data-waste'))modal('Komende inzamelingen','<p>Rest · dinsdag 3 november</p><p>Gft & etensresten · dinsdag 10 november</p><p>Papier en karton · woensdag 18 november</p><p>Voorbeeldgegevens uit de specificatie van 31 oktober.</p>');if(b.hasAttribute('data-search'))modal('Zoek muziek',`<label>Zoekterm <input placeholder="Nummer, artiest of album" style="width:100%;padding:14px;margin:16px 0"></label><p>Dit ontwerp zoekt nog niet in Music Assistant. In de app kies je eerst een resultaat en bevestig je de zichtbare doelspeaker: ${speaker}.</p>`);if(b.dataset.playlist)modal(b.dataset.playlist,`<p>Voorbeeldfavoriet. Geselecteerde speaker: <b>${speaker}</b>.</p><p>De echte afspeellijsten worden uit Music Assistant gekozen.</p>`);if(b.hasAttribute('data-queue'))modal('Wachtrij · '+speaker,'<p>Hier komen de volgende nummers, wanneer de koppeling dit ondersteunt.</p>');if(b.hasAttribute('data-history'))modal('Energiehistorie','<p>Dag · Week · Maand</p><p>De uiteindelijke grafiek toont opwek, verbruik en netstromen uit echte meetgegevens. Er worden hier nog geen historische metingen gesimuleerd.</p>');if(b.hasAttribute('data-camera'))modal('Voordeur · vergroot','<div class="camera-placeholder" style="min-height:240px">Voorbeeld van vergrote cameraruimte</div>');if(b.hasAttribute('data-demo'))toast('Ontwerpvoorbeeld · geen apparaten aangesloten')});
let start;$('#content').addEventListener('touchstart',e=>{if(e.target.closest('button,input'))return;start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});$('#content').addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5){page=Math.max(0,Math.min(4,page+(dx<0?1:-1)));render()}start=null},{passive:true});render();
</script></body></html>
