<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faviconvoorstel · Thuis</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 24px; background: #f5f3ec; color: #30483c; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 700px; margin: auto; }
  h1 { font-size: 32px; font-weight: 550; letter-spacing: -1px; }
  p { max-width: 570px; }
  .preview { display: flex; flex-wrap: wrap; align-items: end; gap: 36px; padding: 36px; border-radius: 24px; background: #fffefa; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 12px; font-size: 12px; color: #7a8177; }
  img { display: block; margin: auto; }
  .tab { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 12px 12px 0 0; background: #fffefa; font-size: 13px; }
  .tab img { margin: 0; }
  .browser { margin-top: 24px; padding: 16px 16px 0; border-radius: 16px; background: #e7ede2; }
  .dark { margin-top: 16px; padding: 24px; border-radius: 16px; background: #182320; }
  .dark img { margin: 0; }
</style>
<main>
  <h1>Thuis, alles bij elkaar.</h1>
  <p>Een huis met dashboardvlakjes en een warmgeel statuslampje. Het huis staat voor thuis; de vlakjes voor overzicht en bediening; het lampje voor actieve automatisering.</p>
  <div class="preview">
    <figure><img src="favicon.svg" width="128" height="128" alt="Groen huisicoon met dashboardvlakjes en geel statuslampje"><figcaption>Ontwerp</figcaption></figure>
    <figure><img src="favicon.svg" width="32" height="32" alt=""><figcaption>32 px</figcaption></figure>
    <figure><img src="favicon.svg" width="16" height="16" alt=""><figcaption>16 px</figcaption></figure>
  </div>
  <div class="browser"><div class="tab"><img src="favicon.svg" width="16" height="16" alt="">Thuis · Gezinsdashboard <span aria-hidden="true">×</span></div></div>
  <div class="dark"><img src="favicon.svg" width="32" height="32" alt="Het favicon op een donkere achtergrond"></div>
</main>
</html>
